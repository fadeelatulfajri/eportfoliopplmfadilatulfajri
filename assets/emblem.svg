<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <circle cx="60" cy="60" r="56" fill="none" stroke="#800020" stroke-width="2"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#800020" stroke-width="0.8" stroke-dasharray="3, 3"/>
  
  <!-- Outer Circular Text Path -->
  <path id="textCircle" d="M 60,60 m -42,0 a 42,42 0 1,1 84,0 a 42,42 0 1,1 -84,0" fill="none"/>
  
  <!-- Central Emblem Geometry: Penta-Star & Scales of Justice & Open Book -->
  <g transform="translate(60,60)">
    <!-- 5-pointed star (Ketuhanan & Pancasila) -->
    <polygon points="0,-22 6,-8 21,-8 9,2 14,16 0,8 -14,16 -9,2 -21,-8 -6,-8" fill="#800020" opacity="0.15"/>
    <polygon points="0,-22 6,-8 21,-8 9,2 14,16 0,8 -14,16 -9,2 -21,-8 -6,-8" fill="none" stroke="#800020" stroke-width="1.2"/>
    
    <!-- Open Book (Pedagogi) -->
    <path d="M -18,12 Q -9,8 0,11 Q 9,8 18,12 L 18,22 Q 9,18 0,21 Q -9,18 -18,22 Z" fill="#FFFFFF" stroke="#800020" stroke-width="1.2"/>
    <line x1="0" y1="11" x2="0" y2="21" stroke="#800020" stroke-width="1"/>
    
    <!-- Scales balance beam (Keadilan & Norma) -->
    <line x1="-12" y1="-2" x2="12" y2="-2" stroke="#800020" stroke-width="1.2"/>
    <line x1="0" y1="-8" x2="0" y2="2" stroke="#800020" stroke-width="1.2"/>
  </g>
</svg>
