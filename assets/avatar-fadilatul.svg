<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="academicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="100%" stop-color="#EFECE6"/>
    </linearGradient>
    <pattern id="dotPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#CEC6BA" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Card Frame -->
  <rect width="400" height="480" fill="url(#academicBg)"/>
  <rect width="400" height="480" fill="url(#dotPattern)"/>
  <rect x="12" y="12" width="376" height="456" fill="none" stroke="#E2DDD5" stroke-width="1.5"/>
  <rect x="18" y="18" width="364" height="444" fill="none" stroke="#800020" stroke-width="0.75" stroke-dasharray="4, 4"/>

  <!-- Top Archival Header -->
  <rect x="30" y="32" width="340" height="28" fill="#FFFFFF" stroke="#E2DDD5" stroke-width="1"/>
  <text x="42" y="50" font-family="'JetBrains Mono', monospace" font-size="9" fill="#800020" font-weight="700" letter-spacing="1.5">KARTU PESERTA PPL MANDIRI • 2024</text>
  <circle cx="354" cy="46" r="4" fill="#800020"/>

  <!-- Portrait Silhouette Graphic -->
  <g transform="translate(100, 80)">
    <!-- Backdrop disc -->
    <circle cx="100" cy="110" r="85" fill="#FFFFFF" stroke="#E2DDD5" stroke-width="2"/>
    <circle cx="100" cy="110" r="78" fill="#F4F1EA"/>
    
    <!-- Academic Formal Suit & Hijab/Pendidik Silhouette -->
    <!-- Head / Hijab drape -->
    <path d="M 65 95 C 65 60, 135 60, 135 95 C 135 125, 120 150, 100 150 C 80 150, 65 125, 65 95 Z" fill="#800020"/>
    <ellipse cx="100" cy="98" rx="22" ry="25" fill="#FAF9F6"/>
    <!-- Face features subtle contour -->
    <path d="M 92 102 Q 100 108 108 102" stroke="#800020" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Blazer / Academic Coat Collar -->
    <path d="M 50 170 C 50 140, 75 135, 100 135 C 125 135, 150 140, 150 170 L 165 210 L 35 210 Z" fill="#1F1D1B"/>
    <!-- White shirt collar -->
    <polygon points="100,140 88,165 100,175 112,165" fill="#FFFFFF"/>
    <!-- Almamater Tie/Sash Maroon -->
    <polygon points="97,175 103,175 106,205 100,210 94,205" fill="#800020"/>
    <!-- Almamater Lapel lines -->
    <path d="M 85 140 L 70 180" stroke="#800020" stroke-width="2"/>
    <path d="M 115 140 L 130 180" stroke="#800020" stroke-width="2"/>
  </g>

  <!-- Name & Credentials Box -->
  <rect x="30" y="305" width="340" height="135" fill="#FFFFFF" stroke="#E2DDD5" stroke-width="1"/>
  <rect x="30" y="305" width="340" height="4" fill="#800020"/>

  <text x="200" y="335" font-family="'Newsreader', Georgia, serif" font-size="19" font-weight="700" fill="#1F1D1B" text-anchor="middle">Fadilatul Fajri, S.Pd.</text>
  <text x="200" y="354" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#800020" text-anchor="middle" letter-spacing="1">NIM: 24010872910</text>
  
  <line x1="50" y1="368" x2="350" y2="368" stroke="#EFECE6" stroke-width="1"/>
  
  <text x="200" y="388" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#4A4643" text-anchor="middle">Pendidikan Pancasila &amp; Kewarganegaraan</text>
  <text x="200" y="405" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#7A7570" text-anchor="middle">LPTK Universitas Negeri Padang</text>
  <text x="200" y="422" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7A7570" text-anchor="middle">Mitra Praktik: SMA Negeri 1 Padang</text>
</svg>
